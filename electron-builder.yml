appId: com.luthinfinity.hublink
productName: Hublink
copyright: Copyright © 2026 Luth

directories:
  output: release
  buildResources: build

# Le renderer est bundle par Vite. Le main n'utilise que des modules Electron,
# a une exception pres : electron-updater, qui doit donc etre embarque avec ses
# dependances de production.
files:
  - src/main/**/*
  - src/preload/**/*
  - src/renderer/dist/**/*
  - package.json
  - '!**/*.map'

asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png

# Publie sur GitHub : electron-updater y lit `latest.yml` pour savoir si une
# version plus recente existe.
publish:
  provider: github
  owner: Luth-infinity
  repo: hublink

nsis:
  # Installation en un clic : une mise a jour ne doit pas rouvrir l'assistant
  # d'installation a chaque fois. Le premier telechargement depuis le site
  # passe par le meme installeur, mais l'utilisateur n'a rien a repondre.
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

linux:
  target: [AppImage]
  category: Network
